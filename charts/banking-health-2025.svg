<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Tunisia banking health and public-sector exposure in 2025</title>
  <desc id="desc">The banking system reported 15.1 percent solvency, 252.8 percent liquidity coverage, a 14.9 percent classified-loan ratio and rising public-sector exposure equal to 27.6 percent of assets.</desc>
  <rect width="1000" height="590" fill="#fff"/>
  <style>.t{font:700 25px system-ui;fill:#17212b}.h{font:700 17px system-ui;fill:#17212b}.s{font:13px system-ui;fill:#52606d}.l{font:15px system-ui;fill:#17212b}.v{font:800 19px system-ui;fill:#17212b}.w{font:700 13px system-ui;fill:#fff}.g{stroke:#e2e6ea;stroke-width:1}</style>
  <text x="40" y="44" class="t">Banks remain capitalized; asset quality and sovereign exposure need watching</text>
  <text x="40" y="69" class="s">End-2025 banking-sector indicators</text>
  <g transform="translate(45 115)">
    <rect width="425" height="165" rx="22" fill="#f5f7f8"/>
    <text x="24" y="34" class="h">Resilience ratios</text>
    <text x="24" y="76" class="l">Solvency</text><rect x="150" y="54" width="185" height="28" rx="5" fill="#087e8b"/><text x="347" y="75" class="v">15.1%</text>
    <text x="24" y="119" class="l">Tier 1 capital</text><rect x="150" y="97" width="149" height="28" rx="5" fill="#52b788"/><text x="311" y="118" class="v">12.1%</text>
    <text x="24" y="150" class="s">Reported sector ratios; prudential interpretation needs bank-level distributions.</text>
    <rect y="185" width="425" height="165" rx="22" fill="#fff1e2"/>
    <text x="24" y="219" class="h">Asset quality</text>
    <text x="24" y="261" class="l">Classified loans</text><rect x="150" y="239" width="184" height="28" rx="5" fill="#f18f01"/><text x="346" y="260" class="v">14.9%</text>
    <text x="24" y="304" class="l">Coverage ratio</text><rect x="150" y="282" width="232" height="28" rx="5" fill="#e70013"/><text x="394" y="303" class="v">51.6%</text>
    <text x="24" y="335" class="s">Private-enterprise classified loans reached 20.8%.</text>
  </g>
  <g transform="translate(520 115)">
    <text x="0" y="0" class="h">Liquidity coverage ratio</text>
    <rect x="0" y="28" width="390" height="42" rx="7" fill="#dfe6eb"/><rect x="0" y="28" width="346" height="42" rx="7" fill="#087e8b"/>
    <text x="12" y="55" class="w">252.8%</text><text x="0" y="91" class="s">Up from 223.3% in 2024</text>
    <text x="0" y="136" class="h">Public-sector financing share of bank assets</text>
    <rect x="0" y="164" width="390" height="42" rx="7" fill="#dfe6eb"/><rect x="0" y="164" width="322" height="42" rx="7" fill="#e70013"/>
    <text x="12" y="191" class="w">27.6%</text><text x="0" y="227" class="s">Up from 24.7% in 2024</text>
    <text x="0" y="272" class="h">Credit allocation</text>
    <text x="0" y="310" class="l">Private professionals</text><text x="390" y="310" text-anchor="end" class="v">TND 67.46bn</text>
    <line x1="0" y1="326" x2="390" y2="326" class="g"/>
    <text x="0" y="356" class="l">Public enterprises</text><text x="390" y="356" text-anchor="end" class="v">TND 16.60bn</text>
    <line x1="0" y1="372" x2="390" y2="372" class="g"/>
    <text x="0" y="402" class="l">Individuals</text><text x="390" y="402" text-anchor="end" class="v">TND 30.54bn</text>
  </g>
  <text x="40" y="550" class="s">Source: BCT Annual Report 2025. Aggregate ratios do not reveal bank-by-bank concentration or borrower-level risk.</text>
</svg>
