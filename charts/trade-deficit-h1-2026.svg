<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Tunisia first-half trade deficit in 2025 and 2026</title>
  <desc id="desc">Stacked columns compare the energy and non-energy trade deficits. The total widened from TND 9.90 billion in the first half of 2025 to TND 12.57 billion in 2026.</desc>
  <rect width="1000" height="520" fill="#fff"/>
  <style>.t{font:700 25px system-ui;fill:#17212b}.s{font:13px system-ui;fill:#52606d}.l{font:15px system-ui;fill:#17212b}.v{font:700 15px system-ui;fill:#17212b}.w{font:700 14px system-ui;fill:#fff}.g{stroke:#d9e2ec}</style>
  <text x="40" y="44" class="t">Trade deficit widened by TND 2.67bn</text>
  <text x="40" y="69" class="s">First half; current prices</text>
  <g transform="translate(170 110)">
    <line x1="0" y1="300" x2="690" y2="300" class="g"/><line x1="0" y1="200" x2="690" y2="200" class="g"/><line x1="0" y1="100" x2="690" y2="100" class="g"/><line x1="0" y1="0" x2="690" y2="0" class="g"/>
    <text x="-20" y="305" text-anchor="end" class="s">0</text><text x="-20" y="205" text-anchor="end" class="s">5</text><text x="-20" y="105" text-anchor="end" class="s">10</text><text x="-20" y="5" text-anchor="end" class="s">15 TND bn</text>
    <rect x="90" y="196" width="170" height="104" fill="#f18f01"/><rect x="90" y="102" width="170" height="94" fill="#3a86ff"/>
    <text x="175" y="252" text-anchor="middle" class="w">Energy 5.21</text><text x="175" y="153" text-anchor="middle" class="w">Other 4.69</text><text x="175" y="88" text-anchor="middle" class="v">Total 9.90</text>
    <rect x="430" y="164" width="170" height="136" fill="#f18f01"/><rect x="430" y="48" width="170" height="116" fill="#3a86ff"/>
    <text x="515" y="237" text-anchor="middle" class="w">Energy 6.78</text><text x="515" y="111" text-anchor="middle" class="w">Other 5.79</text><text x="515" y="34" text-anchor="middle" class="v">Total 12.57</text>
    <text x="175" y="330" text-anchor="middle" class="l">H1 2025</text><text x="515" y="330" text-anchor="middle" class="l">H1 2026</text>
  </g>
  <text x="40" y="480" class="s">Source: INS, foreign trade at current prices, June 2026. “Other” is the calculated non-energy balance.</text>
</svg>
